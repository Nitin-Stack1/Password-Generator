<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="card">
            <h1>Generate a <span class="green">random password</span></h1>
            <p class="descript">Never use an insecure password again.</p>
            <input type="number" id="password-length" min="1" max="15"  placeholder="Enter password length (1-15)">
            <button class="btn" id="gen-Pass">Generate passwords</button>
            <div class="line"></div>
            <div class="pass-field">
                <span class="pass green" id="pass1"></span>
                <span class="pass green" id="pass2"></span>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
